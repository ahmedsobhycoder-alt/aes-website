# AES — Nginx reverse proxy for the Next.js standalone server (PM2 on 127.0.0.1:3000).
# Place at /etc/nginx/sites-available/aes-designstudio.com and symlink into sites-enabled.
# certbot --nginx fills in the TLS (listen 443) block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name aes-designstudio.com www.aes-designstudio.com;

    # Redirect all HTTP to HTTPS (certbot manages the 443 server block).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aes-designstudio.com www.aes-designstudio.com;

    # ssl_certificate / ssl_certificate_key are injected by certbot --nginx.

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Long-lived immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
